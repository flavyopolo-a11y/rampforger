name: Tests und Windows-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete für Qt und OpenGL (Mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Kern-Tests (ohne Oberfläche)
        run: pytest tests/core tests/geometry tests/io tests/compile tests/profiles tests/surf tests/templates tests/validation tests/materials tests/render tests/test_layering.py
      - name: Oberflächen-Tests (offscreen, ohne OpenGL)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ui
      - name: .exe bauen
        run: python packaging/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rampenschmiede-Windows
          path: dist/Rampenschmiede
